# Application Properties for Docker Environment
spring.application.name=singleton-demo

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# CORS Configuration
server.servlet.context-parameters.cors.allowed-origins=*
server.servlet.context-parameters.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
server.servlet.context-parameters.cors.allowed-headers=*

# H2 Database Configuration (Docker)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.singleton=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/app/logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.default-property-inclusion=non_null

# Application Information
application.name=Singleton Design Pattern Demo
application.version=1.0.0
application.description=Full-stack application demonstrating singleton pattern
